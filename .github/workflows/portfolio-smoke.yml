name: Portfolio public QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'scripts/smoke.mjs'
      - 'scripts/browser-qa.mjs'
      - 'package.json'
      - '.github/workflows/portfolio-smoke.yml'
  schedule:
    - cron: '23 13 * * *'

permissions:
  contents: read

concurrency:
  group: portfolio-public-qa
  cancel-in-progress: true

jobs:
  smoke:
    name: HTTP routes and assets
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow Git-based production deployment to publish
        if: github.event_name == 'push'
        run: sleep 75
      - name: Check public pages and images
        id: http_check
        run: node scripts/smoke.mjs https://congyuzhao.com
      - name: Summarize HTTP check
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.http_check.outcome }}
        run: |
          echo "### HTTP routes and assets" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **$CHECK_OUTCOME**" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: 8 public pages, 7 images, and invalid-project 404 recovery." >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Chromium mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Allow Git-based production deployment to publish
        if: github.event_name == 'push'
        run: sleep 75
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test responsive pages and interactions
        id: browser_check
        run: node scripts/browser-qa.mjs https://congyuzhao.com
      - name: Summarize browser check
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.browser_check.outcome }}
        run: |
          echo "### Chromium browser QA" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: **$CHECK_OUTCOME**" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: 8 pages at 320px, 390px and 1440px." >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are attached to the workflow run when available." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7
